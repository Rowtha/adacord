packages:
  - packages/*
overrides:
  jszip: "^3.10.1"
  brace-expansion: "^5.0.7"
  minimatch: "^10.2.3"
  fast-uri: "^4.1.2"
  dompurify: "^3.4.13"
  moment: "^2.30.1"
  js-yaml: "^5.3.0"
  postcss: "^8.5.26"
patchedDependencies:
  eslint-plugin-path-alias@2.1.0: patches/eslint-plugin-path-alias@2.1.0.patch
peerDependencyRules:
  ignoreMissing:
    - eslint-plugin-import
    - eslint
allowedDeprecatedVersions:
  source-map-resolve: '*'
  resolve-url: '*'
  source-map-url: '*'
  urix: '*'
  q: '*'
strictPeerDependencies: false
allowBuilds:
  esbuild: true
pmOnFail: warn
